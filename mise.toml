[tools]
python = "3.11"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }
_.file = ".env.local"
PYTHONPATH = "{{config_root}}/app"

API_HOST = "0.0.0.0"
API_PORT = "8000"

QDRANT_HOST = "localhost"
QDRANT_PORT = "6333"
QDRANT_COLLECTION_PREFIX = "doctalk"

OLLAMA_HOST = "127.0.0.1:11434"
OLLAMA_MODEL = "llama3.2:3b"

CHUNK_MAX_SIZE = "512"
CHUNK_OVERLAP = "50"
CHUNK_MIN_SIZE = "50"
CSV_ROWS_PER_CHUNK = "25"

TOP_K = "5"
RERANK_TOP_K = "10"
USE_RERANKING = "true"

[tasks.install]
description = "Install missing Python dependencies from pyproject.toml"
run = "uv sync"

[tasks.setup]
description = "Initial project setup - install deps and pull LLM model"
depends = ["install", "pull-model"]
run = "mkdir -p uploads sample_data logs"

[tasks.dev]
description = "Start Qdrant + Ollama locally"
depends = ["qdrant", "ollama"]

[tasks.pull-model]
description = "Pull the LLM model via Ollama"
run = "ollama pull $OLLAMA_MODEL"

[tasks.qdrant]
description = "Start local Qdrant server"
run = "qdrant"

[tasks.ollama]
description = "Start locally installed Ollama server"
run = "ollama serve"

[tasks.api]
description = "Start FastAPI dev server with hot reload"
run = "uv run uvicorn app.main:app --reload --host $API_HOST --port $API_PORT"

[tasks.frontend]
description = "Start Streamlit frontend"
run = "uv run streamlit run frontend/app.py"

[tasks.all]
description = "Start all services (infra + ollama + api + frontend)"
depends = ["dev", "api", "frontend"]

[tasks.test-env-up]
description = "Start isolated test Qdrant on port 6335"
run = "docker compose -f docker-compose.test.yml up -d --wait"

[tasks.test-env-down]
description = "Stop and wipe test Qdrant (removes volume)"
run = "docker compose -f docker-compose.test.yml down -v"

[tasks.test]
description = "Start test env then run all tests (test Qdrant stays up after)"
depends = ["test-env-up"]
run = "uv run pytest tests/ -v"

[tasks.check]
description = "Run static analysis only (format + lint + typecheck, no tests)"
run = """
uv run ruff format .
uv run ruff check .
uv run mypy app/
"""

[tasks.dev-check]
description = "Full dev check: static analysis + ping backend and frontend"
run = """
uv run ruff format .
uv run ruff check .
uv run mypy app/
uv run python scripts/ping.py
"""

[tasks.ping]
description = "Ping backend health endpoint and frontend to verify both are up"
run = "uv run python scripts/ping.py"

[tasks.ping-api]
description = "Ping backend health endpoint only"
run = "uv run python scripts/ping.py --api-only"

[tasks.ping-frontend]
description = "Ping frontend only"
run = "uv run python scripts/ping.py --frontend-only"

[tasks.seed]
description = "Seed sample data into collections"
run = "uv run python scripts/seed_demo.py"

[tasks.eval-ragas]
description = "Run RAGAS evaluation (use --limit N to cap samples)"
run = "uv run python eval/run_ragas.py $@"

[tasks.eval-deepeval]
description = "Run DeepEval evaluation (use --limit N to cap samples)"
run = "uv run python eval/run_deepeval.py $@"

[tasks.eval]
description = "Run all evaluations: RAGAS + DeepEval"
depends = ["eval-ragas", "eval-deepeval"]

[tasks.open-qdrant]
description = "Open Qdrant dashboard in browser"
run = "open http://localhost:$QDRANT_PORT/dashboard"

[tasks.open-ollama]
description = "Open Ollama status in browser"
run = "open http://$OLLAMA_HOST"

[tasks.kill-ollama]
description = "Kill Ollama serve process"
run = "pgrep -f 'ollama serve' | xargs kill -9 2>/dev/null && echo 'ollama: killed' || echo 'ollama: not running'"

[tasks.kill-qdrant]
description = "Kill Qdrant process"
run = "pgrep -x qdrant | xargs kill -9 2>/dev/null && echo 'qdrant: killed' || echo 'qdrant: not running'"

[tasks.kill-api]
description = "Kill uvicorn API process (uv wrapper + uvicorn) and free port 8000"
run = "{ pgrep -f 'uvicorn app.main:app'; lsof -ti :$API_PORT; } | sort -u | xargs kill -9 2>/dev/null && echo 'api: killed' || echo 'api: not running'"

[tasks.kill-frontend]
description = "Kill Streamlit frontend process (uv wrapper + streamlit)"
run = "pgrep -f 'streamlit run frontend' | xargs kill -9 2>/dev/null && echo 'frontend: killed' || echo 'frontend: not running'"

[tasks.kill]
description = "Kill all services (Ollama, Qdrant, API, frontend)"
depends = ["kill-ollama", "kill-qdrant", "kill-api", "kill-frontend"]
