[tools]
python = "3.11"
poetry = "latest"
docker-compose = "latest"

[env]
_.python.venv = { path = ".venv", create = true }
PYTHONPATH = "{{config_root}}/app"

# API Configuration
API_HOST = "0.0.0.0"
API_PORT = "8000"

# Qdrant Configuration
QDRANT_HOST = "localhost"
QDRANT_PORT = "6333"
QDRANT_COLLECTION_PREFIX = "doctalk"

# Ollama Configuration
OLLAMA_HOST = "http://localhost"
OLLAMA_PORT = "11434"
OLLAMA_MODEL = "mistral:7b"

# Optional: Claude API (for fallback)
# ANTHROPIC_API_KEY = ""

# Chunking Configuration
CHUNK_MAX_SIZE = "512"
CHUNK_OVERLAP = "50"
CHUNK_MIN_SIZE = "50"
CSV_ROWS_PER_CHUNK = "25"

# Retrieval Configuration
TOP_K = "5"
RERANK_TOP_K = "10"
USE_RERANKING = "true"

# =============================================================================
# SETUP & INSTALLATION
# =============================================================================

[tasks.setup]
description = "Initial project setup - install deps and create dirs"
run = """
if [ ! -f poetry.lock ]; then
  echo "No lock file found, running poetry lock..."
  poetry lock
fi
poetry install
mkdir -p uploads sample_data
"""

[tasks.install]
description = "Install all dependencies from lock file"
run = "poetry install"

[tasks.update]
description = "Update dependencies and regenerate lock file"
run = "poetry update"

[tasks.lock]
description = "Regenerate poetry.lock without installing"
run = "poetry lock"

[tasks.sync]
description = "Sync environment with lock file exactly"
run = "poetry sync"

# =============================================================================
# DEPENDENCY MANAGEMENT
# =============================================================================

[tasks.add]
description = "Add a new dependency (usage: mise run add -- <pkg>)"
run = "poetry add {{arg(name='pkg')}}"

[tasks.add-dev]
description = "Add a dev dependency (usage: mise run add-dev -- <pkg>)"
run = "poetry add --group dev {{arg(name='pkg')}}"

[tasks.remove]
description = "Remove a dependency (usage: mise run remove -- <pkg>)"
run = "poetry remove {{arg(name='pkg')}}"

[tasks.show]
description = "Show installed packages"
run = "poetry show"

[tasks.lock-file]
description = "Update the lock file"
run = "poetry lock"

[tasks.show-tree]
description = "Show dependency tree"
run = "poetry show --tree"

# =============================================================================
# DOCKER & INFRASTRUCTURE
# =============================================================================

[tasks.dev]
description = "Start all infrastructure services (Qdrant + Ollama)"
run = "docker compose up -d qdrant ollama"

[tasks.dev-stop]
description = "Stop all infrastructure services"
run = "docker compose down"

[tasks.dev-logs]
description = "Follow logs for infrastructure services"
run = "docker compose logs -f qdrant ollama"

[tasks.dev-clean]
description = "Stop and remove all containers + volumes"
run = "docker compose down -v"

[tasks.docker]
description = "Run full stack with Docker (app + infra)"
run = "docker compose up --build"

# =============================================================================
# DEVELOPMENT SERVER
# =============================================================================

[tasks.api]
description = "Start FastAPI dev server with hot reload"
run = "poetry run uvicorn app.main:app --reload --host $API_HOST --port $API_PORT"
depends = ["install"]

[tasks.api-prod]
description = "Start FastAPI production server"
run = "poetry run uvicorn app.main:app --host $API_HOST --port $API_PORT --workers 4"
depends = ["install"]

[tasks.frontend]
description = "Start Streamlit frontend"
run = "poetry run streamlit run frontend/app.py"
depends = ["install"]

[tasks.all]
description = "Start all services (infra + api + frontend)"
depends = ["dev", "api"]

# =============================================================================
# TESTING
# =============================================================================

[tasks.test]
description = "Run all tests"
run = "poetry run pytest tests/ -v"
depends = ["install"]

[tasks.test-cov]
description = "Run tests with coverage report"
run = "poetry run pytest tests/ -v --cov=app --cov-report=html --cov-report=term"
depends = ["install"]

[tasks.test-unit]
description = "Run unit tests only"
run = "poetry run pytest tests/ -v -m unit"
depends = ["install"]

[tasks.test-integration]
description = "Run integration tests only"
run = "poetry run pytest tests/ -v -m integration"
depends = ["install"]

[tasks.test-watch]
description = "Run tests in watch mode"
run = "poetry run pytest tests/ -f"
depends = ["install"]

# =============================================================================
# LINTING & FORMATTING
# =============================================================================

[tasks.lint]
description = "Run ruff linter"
run = "poetry run ruff check ."
depends = ["install"]

[tasks.lint-fix]
description = "Run ruff linter with auto-fix"
run = "poetry run ruff check . --fix"
depends = ["install"]

[tasks.format]
description = "Run ruff formatter"
run = "poetry run ruff format ."
depends = ["install"]

[tasks.typecheck]
description = "Run mypy type checking"
run = "poetry run mypy app/"
depends = ["install"]

[tasks.quality]
description = "Run full quality check (lint + format + typecheck + test)"
depends = ["format", "lint", "typecheck", "test"]

# =============================================================================
# DATA & UTILITIES
# =============================================================================

[tasks.seed]
description = "Seed sample data into collections"
run = "poetry run python scripts/seed_demo.py"
depends = ["install"]

[tasks.benchmark]
description = "Run performance benchmarks"
run = "poetry run python scripts/benchmark.py"
depends = ["install"]

[tasks.clean-uploads]
description = "Clean uploads directory"
run = "rm -rf uploads/*"

[tasks.reset-db]
description = "Reset Qdrant data (WARNING: deletes all collections)"
run = """
curl -X DELETE http://localhost:6333/collections/doctalk_default_hr_policies 2>/dev/null || true
curl -X DELETE http://localhost:6333/collections/doctalk_default_financial 2>/dev/null || true
curl -X DELETE http://localhost:6333/collections/doctalk_default_compliance 2>/dev/null || true
echo "Collections reset"
"""

# =============================================================================
# EVALUATION
# =============================================================================

[tasks.eval]
description = "Run RAGAS evaluation"
run = "poetry run python eval/run_ragas.py"
depends = ["install"]

[tasks.eval-deep]
description = "Run DeepEval evaluation"
run = "poetry run python eval/run_deepeval.py"
depends = ["install"]

[tasks.eval-all]
description = "Run all evaluations"
depends = ["eval", "eval-deep"]

# =============================================================================
# SHELL & DEBUG
# =============================================================================

[tasks.shell]
description = "Enter poetry shell (interactive venv)"
run = "poetry shell"

[tasks.py]
description = "Run Python in project environment (usage: mise run py -- -c \"print(1)\")"
run = "poetry run python {{arg(name='args', var=true, default='')}}"

[tasks.run]
description = "Run arbitrary poetry command (usage: mise run run -- <cmd>)"
run = "poetry run {{arg(name='cmd', var=true)}}"
