[tools]
python = "3.11"
uv = "latest"
docker-compose = "latest"

[env]
_.python.venv = { path = ".venv", create = true }
PYTHONPATH = "{{config_root}}/app"

API_HOST = "0.0.0.0"
API_PORT = "8000"

QDRANT_HOST = "localhost"
QDRANT_PORT = "6333"
QDRANT_COLLECTION_PREFIX = "doctalk"

OLLAMA_HOST = "127.0.0.1:11434"
OLLAMA_MODEL = "llama3.2:3b"

CHUNK_MAX_SIZE = "512"
CHUNK_OVERLAP = "50"
CHUNK_MIN_SIZE = "50"
CSV_ROWS_PER_CHUNK = "25"

TOP_K = "5"
RERANK_TOP_K = "10"
USE_RERANKING = "true"

[tasks.setup]
description = "Initial project setup - install deps and create dirs"
run = """
uv sync
mkdir -p uploads sample_data
"""

[tasks.dev]
description = "Start Qdrant in Docker (run 'mise run ollama' separately)"
run = "docker compose up -d qdrant"

[tasks.ollama]
description = "Start local Ollama server"
run = "ollama serve"

[tasks.api]
description = "Start FastAPI dev server with hot reload"
run = "uv run uvicorn app.main:app --reload --host $API_HOST --port $API_PORT"

[tasks.frontend]
description = "Start Streamlit frontend"
run = "uv run streamlit run frontend/app.py"

[tasks.all]
description = "Start all services (infra + ollama + api + frontend)"
depends = ["dev", "ollama", "api"]

[tasks.test]
description = "Run all tests"
run = "uv run pytest tests/ -v"

[tasks.check]
description = "Run static analysis only (format + lint + typecheck, no tests)"
run = """
uv run ruff format .
uv run ruff check .
uv run mypy app/
"""

[tasks.seed]
description = "Seed sample data into collections"
run = "uv run python scripts/seed_demo.py"

[tasks.eval]
description = "Run RAGAS evaluation"
run = "uv run python eval/run_ragas.py"
