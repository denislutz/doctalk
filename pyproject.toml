[tool.poetry]
name = "doctalk"
version = "0.1.0"
description = "Self-hosted RAG system for talking to your documents"
authors = ["Denis Lutz <denis.lutz@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# API
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
python-multipart = "^0.0.9"

# Document Processing
python-docx = "^1.1"
PyMuPDF = "^1.24"
markdown = "^3.6"
pandas = "^2.2"

# RAG / AI
langchain = "^0.2"
langchain-community = "^0.2"
qdrant-client = "^1.9"
sentence-transformers = "^3.0"

# LLM Clients
ollama = "^0.3"
anthropic = "^0.30"

# Evaluation
ragas = "^0.1"
deepeval = "^0.21"

# Frontend
streamlit = "^1.37"

# Utilities
tiktoken = "^0.7"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
ruff = "^0.5"
mypy = "^1.10"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
